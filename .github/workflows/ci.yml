name: run-tests
on: push
permissions: {}
jobs:
  yarn-ubuntu:
    name: yarn-ubuntu
    runs-on: ubuntu-latest
    steps:
    - name: Check out repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Run yarn
      run: |
        yarn && yarn compile && yarn test
  yarn-windows:
    name: yarn-windows
    runs-on: windows-latest
    steps:
    - name: Check out repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Run yarn
      run: |
        yarn && yarn compile && yarn test
